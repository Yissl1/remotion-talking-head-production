interface:
  display_name: "Remotion 口播包装制作"
  short_description: "先准备素材/MG，再确认脚本、30秒预览与成片"
  default_prompt: "创建一个新的口播视频项目。第一条回复先询问我有没有喜欢或参考的剪辑风格；如果没有，就采用已经沉淀好的视频制作规则。用户选择沉淀规则后必须先进入素材与 MG 动画准备阶段：分析主口播、SRT 和已有素材，询问并按描述生成 MG；用户说下一步、不需要 MG 或不需要继续生成了之后，才能生成剪辑脚本。脚本生成后等待用户确认；确认后先生成 30 秒预览；预览确认后再生成完整成片。不得跳过任何确认门。"
policy:
  allow_implicit_invocation: true
